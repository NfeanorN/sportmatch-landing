<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SportMatch favicon">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0E1A2E"/>
    </linearGradient>
    <linearGradient id="track" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#3DFF9D"/>
      <stop offset="100%" stop-color="#20D87C"/>
    </linearGradient>
    <linearGradient id="circuit" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5ECBFF"/>
      <stop offset="100%" stop-color="#6D9DFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- Running track curve -->
  <path
    d="M45 16c-10 0-19 6-24 15-4 7-1 17 8 19 7 1 14-2 19-7"
    fill="none"
    stroke="url(#track)"
    stroke-width="7"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Circuit-inspired S segment -->
  <path
    d="M19 47c6 2 14-1 18-6 3-4 5-9 10-11"
    fill="none"
    stroke="url(#circuit)"
    stroke-width="6"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <circle cx="46" cy="31" r="3.3" fill="#5ECBFF"/>
  <circle cx="19" cy="47" r="3.1" fill="#3DFF9D"/>
</svg>
